# Copy to the EC2 host. This file is not used by the Spring Boot Docker image.
#   sudo cp backend/deploy/nginx.conf /etc/nginx/conf.d/roastmyresume.conf
# If Amazon Linux's default server also binds port 80, disable that block first.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 54.153.31.46;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
