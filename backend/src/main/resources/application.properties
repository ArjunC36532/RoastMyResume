spring.application.name=roastmyresume-api
spring.config.import=optional:file:.env[.properties]
# ResumeAiReviewService builds its own OpenAIClient, so the starter's eager bean
# (which requires openai.api-key) would only fail startup.
spring.autoconfigure.exclude=com.openai.springboot.OpenAIClientAutoConfiguration

# Clerk JWT validation. Override these for production Clerk instances.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER_URI:https://ideal-falcon-47.clerk.accounts.dev}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URI:https://ideal-falcon-47.clerk.accounts.dev/.well-known/jwks.json}

# Supabase Storage. SUPABASE_SERVICE_ROLE_KEY must only be available to this backend.
supabase.url=${SUPABASE_URL:https://vjmvvxnjrwhmacezruvo.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:Resume's}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.upload.max-bytes=${RESUME_UPLOAD_MAX_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
